services:
  postgres:
    image: postgres:17
    container_name: receipt-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: receipt_tracker
      POSTGRES_USER: receipt_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "receipt_tracker", "-d", "receipt_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: receipt_tracker
      DB_USERNAME: receipt_tracker
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
