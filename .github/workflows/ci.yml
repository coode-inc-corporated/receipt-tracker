name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0609f0983b7a228f052f81ef4c3d6510cae254ad
        with:
          version: 12.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm exec tsc -p tsconfig.spec.json --noEmit --incremental false

      - name: Build Core
        run: pnpm build:core

      - name: Build Telegram
        run: pnpm build:telegram

      - name: Build Core Docker image
        run: docker build --file apps/core/Dockerfile --tag receipt-tracker-core:ci .

      - name: Build Telegram Docker image
        run: docker build --file apps/telegram/Dockerfile --tag receipt-tracker-telegram:ci .
